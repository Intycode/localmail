  <rect x="20" y="24" width="32" height="22" rx="4" fill="none" stroke="#2f4f8f" stroke-width="2.6"/>
  <path d="M21 26l15 11 15-11" fill="none" stroke="#2f4f8f" stroke-width="2.6"/>
</svg>
