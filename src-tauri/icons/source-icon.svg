<!--
  Master app icon (blue→cyan squircle, white envelope). Feed this into
  `tauri icon` to regenerate every platform size in this directory; also
  mirrored into apps/client/public/favicon.svg and components/app/AppLogo.tsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a74ee"/>
      <stop offset="1" stop-color="#00c0de"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="68" x2="0" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="68" width="180" height="120" rx="14"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect x="38" y="68" width="180" height="120" rx="14" fill="url(#env)"/>
  <path d="M38 68h180l-90 70z" fill="#d6e6ff" clip-path="url(#clip)"/>
  <path d="M46 76l82 62 82-62" stroke="#2f74e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
